name: Debug build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - dev
    paths-ignore:
      - '**.md'
      - '.github/**'
      - '!.github/workflows/debug.yml'
  pull_request:
    branches:
      - main
      - dev

jobs:
  build:
    name: Linux Debug build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install Go from the feed (golang/go master tip)
        uses: Capricornus007/repo/.github/actions/setup-feed-go@master
      - name: Build
        run: |
          make test
# 用戶 2026-10-11 裁：其他系統整條刪。
# 原本這裡還有 build__windows（runs-on: windows-latest）與 build_darwin（runs-on: macos-latest）
# 兩個 job（兩者的 Setup Go 步都帶 continue-on-error: true），已整條移除；
# 沒有别的 job / artifact / needs 引用它們。
